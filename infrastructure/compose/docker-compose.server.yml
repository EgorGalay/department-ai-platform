services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-department_ai}
      POSTGRES_USER: ${POSTGRES_USER:-department_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - server_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-department_ai}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-department_ai}
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      CORS_ORIGINS: '["${PUBLIC_FRONTEND_ORIGIN}"]'
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://${SERVER_HOST}:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  server_postgres_data:
